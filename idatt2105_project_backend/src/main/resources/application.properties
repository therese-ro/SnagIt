spring.application.name=idatt2105_project_backend

#ChatGPT helped with the '?createDatabaseIfNotExist=true'
spring.datasource.url=jdbc:mysql://localhost:3306/snagit_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#ChatGPT helped with specifying which SQL-files run.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql

springdoc.api-docs.path=/api-docs


